name: ObserveIT (Proofpoint)
description: 'ObserveIT was an insider threat management (ITM) vendor acquired by Proofpoint in
  2019 and folded into the Proofpoint Insider Threat Management product line within Proofpoint''s
  Information Protection portfolio. The platform provides endpoint visibility, user activity
  monitoring, session timelines, and data-loss detection across careless, malicious, and compromised
  users, correlating activity across endpoints, email, and cloud. Integration is delivered through
  webhooks that let SIEM and SOAR tools ingest alerts and automated exports to customer-owned AWS
  S3 storage; ObserveIT no longer operates as a standalone brand and publishes no public developer
  portal, OpenAPI specification, or self-service API documentation.'
